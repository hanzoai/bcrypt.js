# Canonical CI/CD config for hanzoai/bcrypt.js — read by hanzoai/ci (via
# .hanzo/workflows/cicd.yml) and by platform.hanzo.ai.
#
# Library (npm). `npm test` is the repo's own gate and covers both halves that
# can break: tests/index.js exercises hash/compare against the native `bcrypt`
# for cross-implementation agreement, and test:typescript compiles the shipped
# .d.ts under all four module resolutions. Password hashing is the one thing
# here nobody may ship broken, so the gate is the suite, not a build.
test:
  - name: unit
    run: npm ci --no-audit --no-fund && npm test
